<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Employee Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #4f46e5 0%, #312e81 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .login-container {
            width: 100%;
            max-width: 450px;
        }
        .page-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
        }
        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: #1e1b4b;
            text-align: center;
            margin-bottom: 8px;
        }
        .page-subtitle {
            font-size: 14px;
            color: #6b7280;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-label {
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 6px;
        }
        .form-control {
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #d1d5db;
        }
        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .btn-group-custom {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .btn-custom {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary-custom {
            background-color: #4f46e5;
            border: none;
            color: #white;
        }
        .btn-primary-custom:hover {
            background-color: #4338ca;
        }
        .login-hint {
            margin-top: 30px;
            background-color: #f3f4f6;
            border-left: 4px solid #4f46e5;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            font-size: 13px;
            color: #374151;
        }
        .login-hint code {
            color: #b91c1c;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="page-card">
            <h1 class="page-title">Admin Login</h1>
            <p class="page-subtitle">Sign in with your department administrator credentials.</p>

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" placeholder="e.g. hr_admin" value="hr_admin">
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="••••••••" value="Hr@2024">
            </div>

            <div class="btn-group-custom">
                <button type="button" class="btn btn-primary btn-custom btn-primary-custom">Sign In</button>
                <button type="button" class="btn btn-secondary btn-custom">Clear</button>
            </div>

            <div class="login-hint">
                <strong>Demo accounts:</strong><br />
                HR &mdash; <code>hr_admin</code> / <code>Hr@2024</code><br />
                Finance &mdash; <code>fin_admin</code> / <code>Fin@2024</code><br />
                IT &mdash; <code>it_admin</code> / <code>It@2024</code>
            </div>
        </div>
    </div>

</body>
</html>
